; ---------------------------------------------------------------------------
; OpenMote Gen 3.3 — PlatformIO starter project
;
; Copy this whole folder somewhere, open it in VS Code with the PlatformIO
; extension, and hit Build. The custom board definition lives in boards/ next
; to this file, so nothing has to be installed globally.
; ---------------------------------------------------------------------------

[env:openmote]
; pioarduino's platform fork. It tracks current Arduino-ESP32 (3.x / ESP-IDF 5.x),
; which the stock "espressif32" platform does not. Pin the version so a fresh
; checkout builds the same way months from now.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = openmote_gen3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The board file already sets 16 MB flash + OPI PSRAM + USB CDC. Overridden here
; only to point at the partition layout shipped alongside this project.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11

; The OpenMote library. Pin a tag once one is published:
;   https://github.com/Gangwa-Labs/OpenMote.git#1.0.0
lib_deps =
    https://github.com/Gangwa-Labs/OpenMote.git
