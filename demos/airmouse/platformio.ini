; ---------------------------------------------------------------------------
; OpenMote Gen 3.3 — Air Mouse demo
;
; Uses the kit's shared board definition from ../../boards, so clone the whole
; repo rather than copying this folder out on its own.
; ---------------------------------------------------------------------------
[platformio]
boards_dir = ../../boards

[env]
extra_scripts = pre:set_encoding.py

[env:airmouse]
; pioarduino platform -> Arduino 3.x / ESP-IDF 5.5. The Arduino framework gives
; us Wire (I2C), Preferences (NVS calibration store) and the native TinyUSB HID
; stack (USB.h / USBHID.h) used for the absolute pointing device.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = openmote_gen3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = partitions.csv

; The board file already sets ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1 and
; BOARD_HAS_PSRAM, which is exactly what the HID + CDC composite device needs.
build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11

; This demo predates the OpenMote library and talks to the IMU directly, so it
; does not depend on it. Kept as-is because it is known-good on real hardware.
