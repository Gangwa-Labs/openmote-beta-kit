; ---------------------------------------------------------------------------
; OpenMote Gen 3.3 — BLE TV Remote demo
;
; Uses the kit's shared board definition from ../../boards, so clone the whole
; repo rather than copying this folder out on its own.
; ---------------------------------------------------------------------------
[platformio]
boards_dir = ../../boards

[env:tv_remote]
; Pinned to the Arduino-ESP32 2.x platform (ESP-IDF 4.x). Do NOT move this to
; the pioarduino / Arduino 3.x platform the other demos use: the 3.x core ships
; its own NimBLE host, which collides with NimBLE-Arduino 1.4.3 and produces
; multiple-definition link errors inside ESP32-BLE-Keyboard.
platform = espressif32@6.9.0
board = openmote_gen3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Native USB CDC does not survive esptool's default jump to 460800 baud
; ("A fatal error occurred: No serial data received"). Stay at 115200.
upload_speed = 115200

; The ESP32-S3's built-in USB-Serial/JTAG drops the connection right after
; esptool's stub loader starts ("Unable to verify flash chip connection").
; Flashing via the ROM loader instead is slower but reliable here.
upload_flags = --no-stub

; USB CDC serial (GPIO43/44 are wired to D-Pad Up/Down, so UART0 is unusable).
; ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT come from the board definition.
build_flags =
    -DUSE_NIMBLE=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=12

lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2
    h2zero/NimBLE-Arduino@^1.4.3
    crankyoldgit/IRremoteESP8266@^2.8.6

; This demo predates the OpenMote library and uses IRremoteESP8266 directly,
; which is the right choice for long/odd IR protocols. Kept as-is because it is
; known-good on real hardware.
