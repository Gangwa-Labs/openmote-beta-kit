; ---------------------------------------------------------------------------
; OpenMote Gen 3.3 — IR Learn & Replay demo
;
; Uses the kit's shared board definition from ../../boards and the OpenMote
; library from the repo root, so clone the whole repo rather than copying this
; folder out on its own.
; ---------------------------------------------------------------------------
[platformio]
boards_dir = ../../boards

[env:ir_learn]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = openmote_gen3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = partitions.csv

build_flags =
    -std=gnu++17
build_unflags = -std=gnu++11

; The OpenMote library. Pin a tag once one is published:
;   https://github.com/Gangwa-Labs/OpenMote.git#1.0.0
lib_deps =
    https://github.com/Gangwa-Labs/OpenMote.git
